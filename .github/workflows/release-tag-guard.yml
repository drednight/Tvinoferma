name: Release tag guard

# После публикации релиза проверяет, что тег релиза совпадает с версией в latest.json.
# Если GitHub привязал релиз к «untagged-…», исправляет тег, иначе автообновление получит 404.
# Тег берём из поля version, а не из ссылки: tauri-action v1 кладёт в latest.json
# API-ссылку (…/releases/assets/<id>), где тега нет.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Тег релиза совпадает с версией в latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          asset=$(gh api "repos/$REPO/releases/$RELEASE_ID" --jq '.assets[] | select(.name=="latest.json") | .id')
          if [ -z "$asset" ]; then echo "В релизе нет latest.json — проверять нечего."; exit 0; fi
          gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$asset" > latest.json
          version=$(jq -r '.version' latest.json)
          want="v$version"
          echo "Тег релиза: $TAG; версия в latest.json: $version (ожидаем тег $want)"
          # Тег без префикса «v» тоже считаем совпадением — переименовывать его не нужно.
          if [ "$want" = "$TAG" ] || [ "$version" = "${TAG#v}" ]; then
            echo "Тег совпадает с версией."
            exit 0
          fi
          gh api --method PATCH "repos/$REPO/releases/$RELEASE_ID" -f tag_name="$want"
          case "$TAG" in
            untagged-*) gh api --method DELETE "repos/$REPO/git/refs/tags/$TAG" || true ;;
          esac
          echo "Тег релиза исправлен на $want."
