name: Windows acceptance build

# Unsigned test executable only. Never creates a release or updates latest.json.
# Full regression belongs to CI, not a second test run in the packaging job.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-acceptance.yml'
      - '.github/actions/setup-frontend/**'
      - 'js/modules/dashboard/**'
      - 'js/modules/guild/**'
      - 'src-tauri/src/guild.rs'
      - 'src-tauri/src/scripts/guild.js'
      - 'js/settings/**'
      - 'js/core/secrets.js'
      - 'css/modules/todayReference.css'
      # Include orchestration changes as well as adapters: they are bundled in the exe.
      - 'js/modules/cloudSync/**'
      - 'js/modules/automation/**'
      - 'js/core/taskLog.js'
      - 'js/modules/sync/queue.js'
      - 'css/modules/scriptWorkspace.css'
      - 'css/core/taskLog.css'
      - 'src-tauri/src/automation/**'
      - 'src-tauri/src/parsers.rs'
      - 'src-tauri/src/pool.rs'
      - 'js/modules/characters/stateManager.js'
      # Marathon projection and embedded parser fixes need a fresh native executable too.
      - 'js/modules/cloudSync/marathonExport.js'
      - 'js/modules/cloudSync/applyPublicSnapshot.js'
      - 'src-tauri/src/scripts/marathon*.js'
      - 'src-tauri/src/scripts/promo_news_public.js'
      - 'src-tauri/src/cloud_*.rs'
      - 'src-tauri/src/commands/cloud_*.rs'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    # Job-level so rust-cache also keys the test-only profile correctly.
    env:
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-frontend
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-acceptance-no-lto-v1
      - name: Build executable without installer or updater signature
        env:
          TVINOFERMA_GOOGLE_CLIENT_ID: ${{ vars.TVINOFERMA_GOOGLE_CLIENT_ID }}
          TVINOFERMA_GOOGLE_CLIENT_SECRET: ${{ secrets.TVINOFERMA_GOOGLE_CLIENT_SECRET }}
          VITE_YANDEX_CLIENT_ID: ${{ vars.TVINOFERMA_YANDEX_CLIENT_ID }}
        run: ./.github/scripts/build-windows-acceptance.ps1
      - name: Prepare test executable, source identity and checksum
        shell: pwsh
        run: |
          git diff --exit-code -- package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Dependency files changed during packaging; commit the resolved locks first.' }
          New-Item -ItemType Directory acceptance | Out-Null
          Copy-Item src-tauri/target/release/tvinoferma.exe acceptance/Tvinoferma.exe
          $source = git rev-parse HEAD
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          @"
          ТЕСТОВАЯ СБОРКА — НЕ СТАБИЛЬНОЕ ОБНОВЛЕНИЕ

          Исходный код: $source
          Встроенная версия: $version (она не отличает эту тестовую сборку от стабильной).
          Это обычный Windows exe, не установщик и не пакет автообновления.
          Тестовая сборка без LTO; размер и производительность могут отличаться от релиза.
          Нужен установленный Microsoft Edge WebView2 Runtime.

          Запускайте только в ОТДЕЛЬНЫХ ТЕСТОВЫХ УЧЁТНЫХ ЗАПИСЯХ WINDOWS без прежних
          данных Твинофермы. Профиль и vault НЕ изолированы специальным identifier.
          Не запускайте поверх рабочего профиля и не запускайте старую версию
          одновременно с этой сборкой.

          Проверьте новости на «Сегодня», награды марафона, выбор предметов и список дел.
          При конфликте контактов нажмите «Сравнить контакты и выбрать источник».
          Сравните обе версии до подтверждения. Автоматического выбора нет.
          Не передавайте пароли, токены, куки и содержимое резервных копий в чат.

          Стабильный релиз не публиковался; подписи автообновления нет.
          "@ | Set-Content -Encoding utf8 acceptance/ПРОЧИТАТЬ.txt
          $hash = (Get-FileHash acceptance/Tvinoferma.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Tvinoferma.exe" | Set-Content -Encoding ascii acceptance/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Tvinoferma-Windows-acceptance-${{ github.run_id }}
          path: acceptance/
          if-no-files-found: error
          retention-days: 14
