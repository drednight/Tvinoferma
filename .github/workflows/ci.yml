name: CI

on:
  push:
    # Временный запуск проверок незавершённой синхронизации на Windows без PR.
    branches: [main, arena/ae13374c-tvinoferma]
  pull_request:
  schedule:
    # раз в неделю — чтобы новые уязвимости в зависимостях не оставались незамеченными
    - cron: '0 6 * * 1'

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # jsdom 30 требует Node >= 22.22
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Информационный шаг: показывает уязвимости, но не блокирует PR
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # generate_context! требует собранный фронтенд (frontendDist = ../dist)
      - run: mkdir dist
      - run: ./.github/scripts/run-cargo-windows.ps1 test
        env:
          # Отдельные временные имена; значения синтетические и очищаются после теста.
          TF_RUN_CREDENTIAL_MANAGER_TESTS: '1'
      - run: ./.github/scripts/run-cargo-windows.ps1 fmt
      - run: ./.github/scripts/run-cargo-windows.ps1 clippy

  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo install cargo-audit --locked
      - run: bash ./.github/scripts/run-cargo-audit.sh
        continue-on-error: true
