name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # раз в неделю — чтобы новые уязвимости в зависимостях не оставались незамеченными
    - cron: '0 6 * * 1'

# New pushes supersede obsolete PR checks, not checks of another PR/main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - if: github.event_name == 'push'
        run: npx vitest run tests/cloudSnapshotFile.test.js tests/cloudSnapshotFilePanel.ui.test.js
      - run: npm run build

  frontend-tests:
    if: github.event_name != 'push'
    name: frontend-tests (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - uses: actions/cache/restore@v4
        with:
          path: .ci-timings
          key: test-times-v1-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            test-times-v1-${{ github.head_ref || github.ref_name }}-
            test-times-v1-main-
      # Same deterministic LPT plan on all workers; first run collects a baseline.
      - run: node scripts/run-balanced-tests.mjs ${{ matrix.shard }}/8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-times-${{ matrix.shard }}
          path: .ci-results/*.json
          retention-days: 14

  frontend-timings:
    if: github.event_name != 'push'
    needs: frontend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: test-times-*
          path: .ci-results
          merge-multiple: true
      - run: node scripts/merge-test-timings.mjs
      - uses: actions/cache/save@v4
        with:
          path: .ci-timings
          key: test-times-v1-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}

  # Preserve the existing required check name; it cannot pass before ALL shards.
  frontend:
    if: always()
    needs: [frontend-quality, frontend-tests, frontend-timings]
    runs-on: ubuntu-latest
    steps:
      - name: Require quality checks and the complete regression suite
        env:
          QUALITY: ${{ needs.frontend-quality.result }}
          TESTS: ${{ needs.frontend-tests.result }}
          TIMINGS: ${{ needs.frontend-timings.result }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$QUALITY" = success
          if [ "$EVENT" = push ]; then
            test "$TESTS" = skipped
          else
            test "$TESTS" = success
            test "$TIMINGS" = success
          fi

  frontend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  rust-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  rust-checks:
    name: rust-${{ matrix.check }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        check: [test, clippy]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Start cache clock
        id: cache-clock
        shell: pwsh
        run: '"started=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())" >> $env:GITHUB_OUTPUT'
      - uses: swatinem/rust-cache@v2
        id: rust-cache
        with:
          workspaces: src-tauri -> target
      - name: Record Rust cache result
        shell: pwsh
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          CACHE_STARTED: ${{ steps.cache-clock.outputs.started }}
        run: |
          "### Rust ${{ matrix.check }} cache" >> $env:GITHUB_STEP_SUMMARY
          "Cache hit: $env:CACHE_HIT (an empty/false value is not a full hit)." >> $env:GITHUB_STEP_SUMMARY
          $elapsed = ([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() - [long]$env:CACHE_STARTED) / 1000
          "Cache restore step including action overhead: $elapsed seconds." >> $env:GITHUB_STEP_SUMMARY
          rustc -Vv
          cargo -V
      - run: mkdir dist
      - run: ./.github/scripts/run-cargo-windows.ps1 ${{ matrix.check }}
        env:
          TF_RUN_CREDENTIAL_MANAGER_TESTS: '1'
      - if: matrix.check == 'test'
        run: ./.github/scripts/run-cargo-windows.ps1 credential-smoke
        env:
          TF_RUN_CREDENTIAL_MANAGER_TESTS: '1'

  # Keep the protected check name. All native checks must succeed.
  rust:
    if: always()
    needs: [rust-format, rust-checks]
    runs-on: ubuntu-latest
    steps:
      - env:
          FORMAT: ${{ needs.rust-format.result }}
          CHECKS: ${{ needs.rust-checks.result }}
        run: |
          test "$FORMAT" = success
          test "$CHECKS" = success

  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Use a prebuilt auditor instead of recompiling it on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: bash ./.github/scripts/run-cargo-audit.sh
        continue-on-error: true
