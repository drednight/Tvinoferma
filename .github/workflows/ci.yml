name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # раз в неделю — чтобы новые уязвимости в зависимостях не оставались незамеченными
    - cron: '0 6 * * 1'

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Информационный шаг: показывает уязвимости, но не блокирует PR
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # generate_context! требует собранный фронтенд (frontendDist = ../dist)
      - run: mkdir dist
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      # TODO(#8): после `cargo clippy --fix` убрать continue-on-error, чтобы шаг стал блокирующим.
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
        continue-on-error: true

  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock
        continue-on-error: true
