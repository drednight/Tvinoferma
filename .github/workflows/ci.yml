name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # раз в неделю — чтобы новые уязвимости в зависимостях не оставались незамеченными
    - cron: '0 6 * * 1'

# New pushes supersede obsolete PR checks, not checks of another PR/main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - if: github.event_name == 'push'
        run: npx vitest run tests/cloudSnapshotFile.test.js tests/cloudSnapshotFilePanel.ui.test.js
      - run: npm run build

  frontend-tests:
    if: github.event_name != 'push'
    name: frontend-tests (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      # Every file runs exactly once, still isolated; no reduced test selection.
      - run: npm test -- --shard=${{ matrix.shard }}/8 --maxWorkers=2

  # Preserve the existing required check name; it cannot pass before ALL shards.
  frontend:
    if: always()
    needs: [frontend-quality, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require quality checks and the complete regression suite
        env:
          QUALITY: ${{ needs.frontend-quality.result }}
          TESTS: ${{ needs.frontend-tests.result }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$QUALITY" = success
          if [ "$EVENT" = push ]; then
            test "$TESTS" = skipped
          else
            test "$TESTS" = success
          fi

  frontend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  rust-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  rust-checks:
    name: rust-${{ matrix.check }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        check: [test, clippy]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: mkdir dist
      - run: ./.github/scripts/run-cargo-windows.ps1 ${{ matrix.check }}
        env:
          TF_RUN_CREDENTIAL_MANAGER_TESTS: '1'
      - if: matrix.check == 'test'
        run: ./.github/scripts/run-cargo-windows.ps1 credential-smoke
        env:
          TF_RUN_CREDENTIAL_MANAGER_TESTS: '1'

  # Keep the protected check name. All native checks must succeed.
  rust:
    if: always()
    needs: [rust-format, rust-checks]
    runs-on: ubuntu-latest
    steps:
      - env:
          FORMAT: ${{ needs.rust-format.result }}
          CHECKS: ${{ needs.rust-checks.result }}
        run: |
          test "$FORMAT" = success
          test "$CHECKS" = success

  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Use a prebuilt auditor instead of recompiling it on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: bash ./.github/scripts/run-cargo-audit.sh
        continue-on-error: true
