name: Release

# Сборка установщиков Windows (.msi / .exe) и latest.json для автообновления.
# Запуск: git tag v0.2.0 && git push origin v0.2.0 (версия в tauri.conf.json должна совпадать)
# Секреты репозитория: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      # «Что нового» берётся из раздела версии в CHANGELOG.md — это изменения с прошлого релиза.
      # Нет раздела (забыли переименовать [Unreleased]) — сборка останавливается до компиляции.
      - name: Текст «Что нового» из CHANGELOG.md
        id: notes
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$REF_NAME" --github-output
      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Твиноферма ${{ github.ref_name }}'
          # Этот текст попадает и в описание черновика, и в `notes` файла latest.json — его видит
          # пользователь в окне «Доступно обновление». Собирается из CHANGELOG.md (шаг выше).
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json
      # Полное описание релиза (если есть docs/RELEASE-NOTES-X.Y.Z.md) заменяет короткий текст в
      # описании черновика. Файл latest.json уже собран, его `notes` остаются короткими.
      - name: Полное описание релиза
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          file="docs/RELEASE-NOTES-${{ steps.notes.outputs.version }}.md"
          if [ -f "$file" ] && [ -n "${{ steps.tauri.outputs.releaseId }}" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}" -F "body=@$file"
          else
            echo "Файла $file нет — описание релиза остаётся коротким."
          fi
