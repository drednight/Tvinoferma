name: Deploy PW Guides to GitHub Pages

on:
  push:
    branches: [arena/d5d23491-tvinoferma]
    paths: ['demo/guides/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Pages build
        run: |
          mkdir -p _site/css/core _site/assets/icons/classes _site/assets/icons/dungeons
          cp demo/guides/index.html _site/
          cp demo/guides/guides.css _site/
          cp demo/guides/guides-app.js _site/
          cp demo/guides/guides-data.js _site/
          cp css/core/variables.css _site/css/core/
          cp css/core/base.css _site/css/core/
          cp css/core/components.css _site/css/core/
          cp public/assets/icons/classes/*.webp _site/assets/icons/classes/
          cp public/assets/icons/dungeons/pass-*.webp _site/assets/icons/dungeons/
          cp public/assets/icons/app/icon.png _site/assets/icons/app/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
