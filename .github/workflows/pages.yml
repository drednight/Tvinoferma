name: GitHub Pages

# Сайт собирается из main: приложение — сборкой Vite с базой /Tvinoferma/,
# а демо-лаборатория (demo/) и её зависимости (css/, js/ — обычные ES-модули
# без сборки) просто копируются рядом. Настройки Pages: Source → GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # jsdom 30 требует Node >= 22.22
          node-version: 22
          cache: npm
      - run: npm ci
      # База /Tvinoferma/ — только для Pages: десктопная (Tauri) сборка по-прежнему
      # запускается как npm run build без флага и получает базовый '/'
      - run: npm run build -- --base=/Tvinoferma/
      # Демо-лаборатория работает без сборщика: ей нужны сырые css/ и js/ рядом
      - run: cp -r demo css js dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
