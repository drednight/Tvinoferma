name: Шаблон рун для каталога
description: Предложить новый шаблон рун. Проверяется вручную и коммитится в каталог
title: "[Руны] "
labels: ["stage/06"]
body:
  - type: input
    id: class
    attributes:
      label: Класс
      description: Название игрового класса
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Автор
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Дата добавления или обновления раскладки
      placeholder: "2026-10-01"
    validations:
      required: true
  - type: textarea
    id: pvp
    attributes:
      label: Шаблон PvP
      render: text
  - type: textarea
    id: pve
    attributes:
      label: Шаблон PvE
      render: text
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Дополнительные руны
      render: text
  - type: textarea
    id: notes
    attributes:
      label: Комментарий
