[package]
name = "tvinoferma"
version = "2.2.0"
description = "Менеджер персонажей Твинофермы"
authors = ["#Дреднайт"]
license = "MIT"
edition = "2021"

[lib]
name = "tvinoferma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
# Один экземпляр приложения: повторный запуск поднимает уже открытое окно, а не создаёт второе
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time"] }
urlencoding = "2.1"
# Хранилище учётных данных ОС: Windows Credential Manager / macOS Keychain / Secret Service (Linux)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
aes-gcm = "0.11"

# Разбор скриншота с характеристиками персонажа: встроенный в Windows распознаватель текста.
# Windows.Media.Ocr знает русский язык, доустанавливать ничего не нужно; на других системах
# команда просто сообщает, что разбор недоступен.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    # Запись «Запомнить вход» напрямую в Credential Manager (`vault.rs`): запасной способ,
    # если keyring не может писать из сессии пользователя (Windows ERROR 1312).
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_System_Registry",
] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Фича zip выключена: приложение публикует .msi и -setup.exe, zip-артефакты не нужны,
# а в zip 4.6.1 числится critical-уязвимость (symlink escape при распаковке).
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }

# Релизная сборка: меньше установщик и exe. Время сборки в CI вырастет (полный LTO, один codegen-unit).
# panic = "abort" не включён намеренно: сейчас паника в фоновой задаче не роняет всё приложение.
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
