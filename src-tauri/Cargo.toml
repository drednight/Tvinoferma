[package]
name = "tvinoferma"
version = "0.3.0"
description = "Менеджер персонажей Твинофермы"
authors = ["#Дреднайт"]
license = "MIT"
edition = "2021"

[lib]
name = "tvinoferma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["time"] }
urlencoding = "2.1"
# Хранилище учётных данных ОС: Windows Credential Manager / macOS Keychain / Secret Service (Linux)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
aes-gcm = "0.10"

# Разбор скриншота с характеристиками персонажа: встроенный в Windows распознаватель текста.
# Windows.Media.Ocr знает русский язык, доустанавливать ничего не нужно; на других системах
# команда просто сообщает, что разбор недоступен.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Win32_System_Registry",
] }
# Ожидание асинхронного распознавания (`Async::join`)
windows-future = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
