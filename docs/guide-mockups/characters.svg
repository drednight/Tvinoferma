<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Пример карточек вымышленных персонажей</title>
  <desc id="desc">Три иллюстративные карточки с вымышленными никами, классами, показателями и проходками.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#171c27"/><stop offset="1" stop-color="#10141d"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#7c91ff"/><stop offset="1" stop-color="#b38cff"/></linearGradient>
  </defs>
  <rect width="960" height="480" rx="24" fill="#0b0e15"/>
  <text x="38" y="48" fill="#f2f4fb" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700">Персонажи · демонстрационные данные</text>
  <g font-family="Segoe UI, sans-serif">
