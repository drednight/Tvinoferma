<!doctype html>
<!--
  docs/prototypes/finance-variant-5.html
  Пятый вариант раздела «Учёт» — «Рабочий стол».

  Чем отличается от живой страницы (js/modules/finance/page.js) и от прототипа
  finance-layouts.html:
  - нет вкладок: всё на одной странице (KPI → месяцы → журнал → комиссионка → долги);
  - журнал выбранного месяца в рамке фиксированной высоты (страница не растёт);
  - поиск по тексту и фильтр по источнику — функциональное добавление;
  - необязательная колонка «Итог» (нарастающий остаток по валюте);
  - месяцы выбираются кликом, активный подсвечен.

  Прототип, не часть приложения: ничего не сохраняет.
  Числа считает js/modules/finance/model.js — та же модель, что в приложении.
-->
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Учёт — вариант 5 «Рабочий стол»</title>
  <link rel="stylesheet" href="/css/core/variables.css" />
  <link rel="stylesheet" href="/css/core/base.css" />
  <link rel="stylesheet" href="/css/core/components.css" />
  <link rel="stylesheet" href="/css/modules/finance.css" />
  <style>
    body { padding: 24px 28px 80px; }
    .proto-head { max-width: 1000px; margin-bottom: 18px; }
    .proto-head h1 { margin: 0 0 8px; font-size: 1.5rem; }
    .proto-head p { margin: 0 0 6px; color: var(--text-dim); font-size: 0.9rem; line-height: 1.5; }

    /* Липкая панель действий: действия всегда под рукой при длинном списке */
    .desk-bar {
      position: sticky; top: 0; z-index: 5;
      display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
      margin: 0 -28px 18px; padding: 12px 28px;
      background: var(--surface-glass); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .desk-bar .grp { display: flex; align-items: center; gap: 8px; }
    .desk-bar .grp-label { color: var(--text-faint); font-size: 0.78rem; }
    .desk-search { flex: 1 1 220px; min-width: 180px; }
    .desk-search input {
      width: 100%; padding: 8px 12px;
      border: 1px solid var(--border); border-radius: var(--radius-pill);
      background: var(--surface-2); color: var(--text); font: inherit; font-size: 0.86rem;
    }
    .desk-search input:focus-visible { outline: none; border-color: var(--accent-line); box-shadow: var(--focus-ring); }

    /* KPI-панели */
    .pans { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 18px; }
    .pan { display: grid; gap: 3px; align-content: start; padding: 12px 14px;
      border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-1); }
    .pan-label { color: var(--text-dim); font-size: 0.78rem; }
    .pan-value { font-size: 1.45rem; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.15; }
    .pan-sub { color: var(--text-faint); font-size: 0.74rem; font-variant-numeric: tabular-nums; }
    .pan-row { display: flex; justify-content: space-between; gap: 10px; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
    .pan-row span { color: var(--text-faint); }

    /* Фильтр по источнику */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
    .chips-label { color: var(--text-faint); font-size: 0.78rem; }
    .chip-btn { padding: 4px 11px; border: 1px solid var(--border); border-radius: var(--radius-pill);
      background: var(--surface-1); color: var(--text-dim); font: inherit; font-size: 0.8rem; cursor: pointer; }
    .chip-btn:hover { border-color: var(--border-strong); color: var(--text); }
    .chip-btn.active { border-color: var(--accent-line); background: var(--accent-soft); color: var(--text); font-weight: 650; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-pill); overflow: hidden; }
    .seg button { padding: 4px 11px; border: 0; background: var(--surface-1); color: var(--text-dim); font: inherit; font-size: 0.8rem; cursor: pointer; }
    .seg button.active { background: var(--accent); color: var(--on-accent); font-weight: 650; }

    /* Сетка месяцев: 7 в ряд, дальше скролл */
    .block-h { margin: 0 0 10px; font-size: 0.98rem; }
    .months-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; }
    @media (max-width: 1500px) { .months-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    @media (max-width: 900px) { .months-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .month-card { display: grid; gap: 2px; text-align: left; padding: 9px 11px;
      border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-1); color: inherit; cursor: pointer; }
    .month-card:hover { border-color: var(--accent-line); }
    .month-card.active { border-color: var(--accent); background: var(--accent-soft); }
    .month-card b { font-size: 0.86rem; font-weight: 600; }
    .month-card .mc-sum { font-size: 0.8rem; font-variant-numeric: tabular-nums; font-weight: 650; }
    .month-card small { color: var(--text-faint); font-size: 0.7rem; font-variant-numeric: tabular-nums; }

    /* Открытый месяц: фиксированная высота, прокрутка внутри */
    .month-open { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 14px; align-items: start; }
    @media (max-width: 900px) { .month-open { grid-template-columns: minmax(0, 1fr); } }
    .month-body { height: 470px; overflow-y: auto; padding-right: 6px;
      border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-1); }
    .month-body::-webkit-scrollbar { width: 10px; }
    .month-body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; }

    /* Активный фильтр */
    .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      margin-bottom: 10px; padding: 8px 12px;
      border: 1px solid var(--accent-line); border-radius: var(--radius-sm); background: var(--accent-soft); }
    .filter-chip { display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 6px 3px 10px; border-radius: var(--radius-pill);
      background: var(--accent); color: var(--on-accent); font-size: 0.78rem; font-weight: 600; }
    .filter-chip button { padding: 0 3px; border: 0; background: none; color: inherit; cursor: pointer; font-size: 0.9rem; line-height: 1; }

    /* Комиссионка 5×4 */
    /* Комиссионка: слоты по центру, а на широком экране по бокам — списки предметов */
    .shop-layout { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 1040px; margin-inline: auto; }
    @media (max-width: 900px) { .shop-layout { grid-template-columns: minmax(0, 1fr); } }
    .shop-list { display: none; }
    @media (min-width: 1400px) {
      .shop-layout { grid-template-columns: 220px minmax(0, 1fr) minmax(0, 1fr) 220px; max-width: 1420px; }
      .shop-list { display: grid; gap: 8px; align-content: start; }
    }
    .shop-list-head { font-size: 0.9rem; font-weight: 650; }
    .shop-list-items { display: grid; gap: 6px; max-height: 460px; overflow-y: auto; padding-right: 4px; }
    .shop-list-item { display: grid; gap: 1px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-1); }
    .shop-list-item b { font-size: 0.8rem; overflow-wrap: anywhere; }
    .shop-list-item span { font-size: 0.74rem; }
    /* Голд-сделка — это обмен валюты, а не расход: отдельная метка, чтобы не путать
       «покупку голда за золото» с обычными тратами */
    .fin-chip.is-conv { background: var(--accent-soft); color: var(--accent); }
    .shop-side { border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-1); padding: 12px 14px; }
    .shop-side-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
    .shop-side-head h4 { margin: 0; font-size: 0.95rem; }
    .slots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; max-width: 640px; margin: 0 auto; }
    .slot { position: relative; aspect-ratio: 1; border-radius: var(--radius-xs);
      border: 1px dashed var(--border); background: transparent; cursor: pointer;
      display: grid; place-items: center; padding: 3px; }
    .slot.is-empty { color: var(--text-faint); font-size: 1rem; }
    .slot.is-empty:hover { border-color: var(--accent-line); color: var(--accent); }
    /* Вместо инициалов — полное название с переносом по словам: слот читается как предмет */
    .slot.is-filled { border: 1px solid hsl(var(--hue) 45% 38%); background: hsl(var(--hue) 42% 20%);
      color: hsl(var(--hue) 75% 90%); font-weight: 600; font-size: 0.66rem; line-height: 1.15;
      letter-spacing: 0; text-align: center; overflow-wrap: anywhere; }
    .slot.is-filled:hover { background: hsl(var(--hue) 45% 26%); }
    .slot-name { display: block; }
    .slot-qty { position: absolute; right: 3px; bottom: 2px; font-size: 0.62rem; font-weight: 600; opacity: 0.9; font-variant-numeric: tabular-nums; }
    .shop-side-foot { display: flex; justify-content: space-between; align-items: baseline;
      margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border);
      font-size: 0.82rem; font-variant-numeric: tabular-nums; }
    .shop-note { margin: 8px 0 0; font-size: 0.76rem; color: var(--text-dim); }

    /* Полоса погашения */
    .bar { height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
    .bar > i { display: block; height: 100%; border-radius: 3px; background: var(--success); }
    .bar.is-neg > i { background: var(--danger); }

    /* Долги Д1 */
    .debt-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center;
      padding: 12px 14px; border: 1px solid var(--border); border-left: 3px solid var(--success);
      border-radius: var(--radius-sm); background: var(--surface-1); }
    .debt-row.is-borrowed { border-left-color: var(--danger); }
    .debt-main { min-width: 0; display: grid; gap: 5px; }
    .debt-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
    .debt-title b { font-size: 0.95rem; }
    .debt-meta { color: var(--text-faint); font-size: 0.76rem; font-variant-numeric: tabular-nums; }
    .debt-prog { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    .debt-due { text-align: right; }
    .debt-due small { display: block; color: var(--text-faint); font-size: 0.72rem; }
    .debt-due b { font-size: 1.05rem; font-variant-numeric: tabular-nums; color: var(--warning); }
    .debt-acts { display: flex; gap: 6px; margin-top: 8px; }

    .stack { display: grid; gap: 14px; }
    .desk-section { margin-bottom: 34px; }
  </style>
</head>
<body>
  <div class="proto-head">
    <h1>Вариант 5 — «Рабочий стол»</h1>
    <p>Один экран без вкладок: KPI → выбор месяца → журнал в рамке → комиссионка 5×4 → долги.
       Поиск, фильтр по источнику и колонка «Итог» — функциональные отличия от живой страницы.</p>
  </div>

  <div id="out"></div>

  <script type="module">
    import {
      normalizeFinance, balances, ledgerTotalsByCurrency, groupByMonth,
      loanStatus, shopTotals, formatAmount, CURRENCY_IDS, CURRENCIES, goldDealOperations
    } from '/js/modules/finance/model.js';

    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = (v, c = 'gold') => formatAmount(c, v);
    const cur = (id) => CURRENCIES[id] || CURRENCIES.gold;
    const signed = (v, c) => `${v >= 0 ? '+' : '−'}${fmt(Math.abs(v), c)}`;
    const SOURCE_LABEL = { manual: 'Ручные', shop: 'Комиссионка', gold: 'Голд', debt: 'Долг' };

    const initials = (name) => String(name).trim().split(/\s+/)
      .slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '?';
    const hueOf = (name) => {
      let h = 0;
      for (const ch of String(name)) h = (h * 31 + ch.codePointAt(0)) % 360;
      return h;
    };

    const SOURCES = [
      { who: 'Ежа', base: 300000000, spread: 260000000, kind: 'in' },
      { who: 'ЗП Клановое', base: 356000000, spread: 12000000, kind: 'in' },
      { who: 'Сундуки', base: 875752175, spread: 500000000, kind: 'in' },
      { who: 'Твинам', base: 229190230, spread: 90000000, kind: 'in' },
      { who: 'Голд', base: 50000000, spread: 30000000, kind: 'out' },
      { who: 'Расходка', base: 90000000, spread: 60000000, kind: 'out' },
      { who: 'Релики', base: 40000000, spread: 25000000, kind: 'out' }
    ];
    const NOTES = ['на релики', 'сундуки + поджог', 'за месяц', 'метеориты', 'проценты', 'долить катало'];

    let seed = 20261016;
    const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };

    const operations = [];
    for (let m = 0; m < 10; m++) {
      const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - m);
      const year = d.getFullYear(), month = d.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const count = 52 + Math.floor(rnd() * 38);
      for (let i = 0; i < count; i++) {
        const s = SOURCES[Math.floor(rnd() * SOURCES.length)];
        operations.push({
          date: `${year}-${String(month + 1).padStart(2, '0')}-${String(1 + Math.floor(rnd() * daysInMonth)).padStart(2, '0')}`,
          kind: s.kind, currency: 'gold',
          amount: Math.round((s.base + rnd() * s.spread) / 1000) * 1000,
          counterparty: s.who, note: NOTES[Math.floor(rnd() * NOTES.length)]
        });
      }
      const g = 1 + Math.floor(rnd() * 400);
      const gd = `${year}-${String(month + 1).padStart(2, '0')}-15`;
      // Продажа голда: голд уходит (потратил), золото приходит (получил).
      // Покупка голда: золото уходит (потратил), голд приходит (получил) —
      // золото основное, поэтому именно его движение подписано «Потратил».
      operations.push(...goldDealOperations({ side: 'sell', coins: g, rate: 1000000, commissionPct: 20, date: gd }).operations);
      operations.push(...goldDealOperations({ side: 'buy', coins: Math.max(1, Math.round(g / 2)), rate: 1000000, commissionPct: 20, date: gd }).operations);
    }

    const BASE = {
      operations,
      shopItems: [
        { side: 'sell', name: 'Зелье восстановления', price: 120000, qty: 5, date: '2026-10-12' },
        { side: 'sell', name: 'Великие знаки юга', price: 5000000, qty: 2, date: '2026-10-10' },
        { side: 'sell', name: 'Сундук говна', price: 875752175, qty: 1, date: '2026-10-09' },
        { side: 'sell', name: 'Твины релики', price: 33333334, qty: 6, date: '2026-10-06' },
        { side: 'sell', name: 'Ресчая крупа', price: 45000, qty: 12, date: '2026-10-05' },
        { side: 'buy', name: 'Шахматный конь', price: 250000, qty: 4, date: '2026-10-08' },
        { side: 'buy', name: 'Нефритовые лисы', price: 30000000, qty: 3, date: '2026-10-04' },
        { side: 'buy', name: 'Сигна боковая', price: 75000, qty: 8, date: '2026-10-03' }
      ],
      loans: [
        { direction: 'lent', who: 'Шкила', principal: 1000000, percent: 5, start: '2026-01-01', end: '2026-12-01', currency: 'gold',
          payments: [{ date: '2026-08-15', amount: 300000 }] },
        { direction: 'borrowed', who: 'Ракохаме', principal: 2500000, percent: 3, start: '2026-07-01', end: '2027-01-01', currency: 'gold', payments: [] },
        { direction: 'lent', who: 'Ксюха', principal: 400000, percent: 10, start: '2026-09-01', end: '2026-11-01', currency: 'gold',
          payments: [{ date: '2026-10-01', amount: 400000 }] }
      ],
      settings: { goldRate: 1000000, commissionPct: 2, goldRateAt: '2026-10-11' }
    };

    const state = normalizeFinance(BASE);
    const now = balances(state.operations);
    const months = groupByMonth(state.operations);
    const totals = shopTotals(state.shopItems);

    let selected = months[0].month;
    let query = '';
    let sourceFilter = null;
    let currencyFilter = null;   // null = обе валюты
    let showBalance = true;
    let debtStyle = 1;

    const monthsGrid = () => `
      <h3 class="block-h">Месяцы</h3>
      <div class="months-grid">
        ${months.map(m => `
          <button type="button" class="month-card ${m.month === selected ? 'active' : ''}" data-month="${m.month}">
            <b>${esc(m.label)}</b>
            <span class="mc-sum">
              ${CURRENCY_IDS.map(id => `<span class="${m.totals[id].balance < 0 ? 'fin-out' : 'fin-in'}">${signed(m.totals[id].balance, id)}</span>`).join('<br>')}
            </span>
            <small>${m.operations.length} записей</small>
          </button>`).join('')}
      </div>`;

    const rows = (items) => items.map(op => {
      const isIn = op.kind === 'in';
      return `
        <tr class="fin-row">
          <td class="fin-date">${esc(op.date.slice(8))}.${esc(op.date.slice(5, 7))}</td>
          <td>
            ${op.source === 'gold'
              ? '<span class="fin-chip is-conv">Конвертация</span>'
              : `<span class="fin-chip ${isIn ? 'is-in' : 'is-out'}">${isIn ? 'Получил' : 'Потратил'}</span>`}
            ${SOURCE_LABEL[op.source] ? `<span class="fin-source">${esc(SOURCE_LABEL[op.source])}</span>` : ''}
          </td>
          <td class="fin-what">
            <b>${esc(op.counterparty || '—')}</b>
            ${op.note ? `<small class="muted">${esc(op.note)}</small>` : ''}
          </td>
          <td class="fin-amount ${isIn ? 'fin-in' : 'fin-out'}">${isIn ? '+' : '−'}${fmt(op.amount, op.currency)}</td>
          ${showBalance ? `<td class="fin-num ${balMap[op.id] < 0 ? 'fin-out' : 'fin-in'}">${signed(balMap[op.id], op.currency)}</td>` : ''}
        </tr>`;
    }).join('');

    const monthOpen = () => {
      const sel = months.find(m => m.month === selected);
      const q = query.trim().toLowerCase();
      let list = sel.operations;
      if (sourceFilter) list = list.filter(o => o.source === sourceFilter);
      if (currencyFilter) list = list.filter(o => o.currency === currencyFilter);
      if (q) list = list.filter(o =>
        (o.counterparty || '').toLowerCase().includes(q) || (o.note || '').toLowerCase().includes(q));
      const head = showBalance ? '<th class="fin-num">Итог</th>' : '';
      const sumCcy = currencyFilter || 'gold';
      return `
        <h3 class="block-h">${esc(sel.label)} · ${list.length} записей</h3>
        ${(sourceFilter || q) ? `
          <div class="filter-bar">
            <span class="muted">Показано:</span>
            ${sourceFilter ? `<span class="filter-chip">${esc(SOURCE_LABEL[sourceFilter])}<button type="button" data-clear-source>×</button></span>` : ''}
            ${currencyFilter ? `<span class="filter-chip">${esc(cur(currencyFilter).title)}<button type="button" data-clear-currency>×</button></span>` : ''}
            ${q ? `<span class="filter-chip">«${esc(query)}»<button type="button" data-clear-query>×</button></span>` : ''}
            <span class="muted">${list.length} записей · ${signed(list.reduce((a, o) => a + (o.kind === 'in' ? o.amount : -o.amount), 0), sumCcy)}</span>
          </div>` : ''}
        <div class="month-body">
          <div class="fin-table-wrap">
            <table class="fin-table">
              <thead><tr><th>Дата</th><th>Вид</th><th>Откуда / на что</th><th class="fin-num">Сумма</th>${head}</tr></thead>
              <tbody>${list.length ? rows(list) : '<tr><td colspan="5"><p class="fin-empty">Ничего не найдено по текущим фильтрам.</p></td></tr>'}</tbody>
            </table>
          </div>
        </div>`;
    };

    /** Список предметов рядом со своей колонкой: видно название, количество и цену. */
    const shopList = (side) => {
      const items = state.shopItems.filter(i => (i.side === 'buy') === (side === 'buy'));
      return `
        <aside class="shop-list">
          <div class="shop-list-head">${side === 'sell' ? 'Продажа' : 'Покупка'}</div>
          <div class="shop-list-items">
            ${items.length ? items.map(i => `
              <div class="shop-list-item">
                <b>${esc(i.name)}</b>
                <span class="muted">×${fmt(i.qty)} · ${fmt(i.price)}</span>
              </div>`).join('') : '<p class="fin-empty">Пусто</p>'}
          </div>
        </aside>`;
    };

    const shopSide = (side) => {
      const isSell = side === 'sell';
      const items = state.shopItems.filter(i => (i.side === 'buy') === !isSell);
      const sum = isSell ? totals.sell : totals.buy;
      const qty = items.reduce((a, i) => a + i.qty, 0);
      const cells = items.slice(0, 20).map(i => `
        <button type="button" class="slot is-filled" style="--hue: ${hueOf(i.name)}"
                title="${esc(i.name)} — ${fmt(i.qty)} шт. по ${fmt(i.price)}">
          <span class="slot-name">${esc(i.name)}</span><span class="slot-qty">×${fmt(i.qty)}</span>
        </button>`).join('')
        + '<button type="button" class="slot is-empty" title="Добавить предмет">+</button>'.repeat(Math.max(0, 20 - items.length));
      return `
        <div class="shop-side">
          <div class="shop-side-head">
            <h4>${isSell ? 'Продажа' : 'Покупка'}</h4>
          </div>
          <div class="slots">${cells}</div>
          <div class="shop-side-foot">
            <span class="muted">${items.length} предм. · ${fmt(qty)} шт.</span>
            <b class="${isSell ? 'fin-in' : 'fin-out'}">${isSell ? '+' : '−'}${fmt(sum.sum)}</b>
          </div>
        </div>`;
    };

    const bar = (st, lent) => {
      const pct = st.principal > 0 ? Math.min(100, Math.round(st.paid / st.principal * 100)) : 0;
      return `<div class="bar ${lent ? '' : 'is-neg'}"><i style="width:${pct}%"></i></div>`;
    };
    const acts = () => `
      <button type="button" class="btn primary small">💵 Выплатить всё</button>
      <button type="button" class="btn small">💸 Частично</button>
      <button type="button" class="btn ghost small">✅ Закрыть</button>`;

    const debtsBlock = () => {
      if (!state.loans.length) {
        return `<div class="debt-row" style="border-left-color:var(--success)">
          <div class="debt-main"><b>Долгов нет</b>
            <span class="debt-meta">Никто не должен и ты ничего не должен.</span></div>
          <button type="button" class="btn small">🤝 Дать в долг</button>
        </div>`;
      }
      return state.loans.map(loan => {
        const st = loanStatus(loan);
        const lent = loan.direction !== 'borrowed';
        return `
          <div class="debt-row ${lent ? 'is-lent' : 'is-borrowed'}">
            <div class="debt-main">
              <div class="debt-title">
                <span class="fin-chip ${lent ? 'is-in' : 'is-out'}">${lent ? 'Дано' : 'Взято'}</span>
                <b>${esc(loan.who)}</b>
                ${st.overdue ? '<span class="fin-chip is-warn">Просрочен</span>' : ''}
                ${st.settled ? '<span class="fin-chip is-done">Закрыт</span>' : ''}
                <span class="debt-meta">${fmt(loan.principal)} · ${fmt(loan.percent)}%/мес · прошло ${esc(st.days)} дн.</span>
              </div>
              <div class="debt-prog">
                ${bar(st, lent)}
                <span class="debt-meta">погашено ${fmt(st.paid)} из ${fmt(st.principal)}</span>
              </div>
              <div class="debt-acts">${acts()}</div>
            </div>
            <div class="debt-due">
              <small>должен вернуть</small>
              <b>${fmt(st.total)}</b>
            </div>
          </div>`;
      }).join('');
    };

    const render = () => {
      // Поиск перерисовывает страницу на каждый символ: запоминаем фокус, чтобы
      // курсор не улетал из поля после каждого нажатия
      const searchFocused = document.activeElement?.matches?.('[data-query]') || false;
      const sel = months.find(m => m.month === selected);
      const asc = [...sel.operations].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
      const acc = {};
      for (const op of asc) {
        acc[op.currency] = (acc[op.currency] || 0) + (op.kind === 'in' ? op.amount : -op.amount);
        balMap[op.id] = acc[op.currency];
      }

      document.getElementById('out').innerHTML = `
        <div class="desk-bar">
          <div class="grp">
            <button type="button" class="btn primary">➕ Записать движение</button>
          </div>
          <div class="grp">
            <span class="grp-label">Голд:</span>
            <button type="button" class="btn">💰 Продать</button>
            <button type="button" class="btn">🛒 Купить</button>
          </div>
          <div class="grp">
            <span class="grp-label">Долги:</span>
            <button type="button" class="btn ghost">🤝 Дать</button>
            <button type="button" class="btn ghost">📥 Взять</button>
          </div>
          <div class="grp">
            <span class="grp-label">Валюта:</span>
            <span class="seg" data-currency-seg>
              <button type="button" data-currency="" class="${currencyFilter === null ? 'active' : ''}">Обе</button>
              ${CURRENCY_IDS.map(id => `<button type="button" data-currency="${id}" class="${currencyFilter === id ? 'active' : ''}">${cur(id).short}</button>`).join('')}
            </span>
          </div>
          <label class="muted" style="display:flex;align-items:center;gap:6px;font-size:0.82rem;cursor:pointer">
            <input type="checkbox" data-balance ${showBalance ? 'checked' : ''} /> Итог
          </label>
          <div class="desk-search">
            <input type="search" placeholder="Поиск по источнику или примечанию…" value="${esc(query)}" data-query />
          </div>
        </div>

        <section class="desk-section">
          <div class="pans">
            ${CURRENCY_IDS.map(id => `
              <div class="pan">
                <span class="pan-label">${cur(id).icon} ${esc(cur(id).title)}</span>
                <span class="pan-value ${now[id] < 0 ? 'fin-out' : ''}">${fmt(now[id], id)}</span>
                <span class="pan-sub">за ${esc(months[0].label)} ${signed(months[0].totals[id].balance, id)}</span>
              </div>`).join('')}
            <div class="pan">
              <span class="pan-label">🤝 Долги</span>
              ${state.loans.length
                ? `<span class="pan-row"><span>должны вернуть</span><b class="fin-in">${fmt(state.loans.filter(l => l.direction !== 'borrowed').reduce((a, l) => a + loanStatus(l).total, 0))}</b></span>
                   <span class="pan-row"><span>я должен</span><b class="fin-out">${fmt(state.loans.filter(l => l.direction === 'borrowed').reduce((a, l) => a + loanStatus(l).total, 0))}</b></span>`
                : '<span class="pan-value" style="font-size:1.1rem;color:var(--success)">нет</span>'}
            </div>
            <div class="pan">
              <span class="pan-label">🏪 Комиссионка</span>
              <span class="pan-row"><span>продаю</span><b>${fmt(totals.sell.sum)}</b></span>
              <span class="pan-row"><span>покупаю</span><b>${fmt(totals.buy.sum)}</b></span>
            </div>
          </div>
        </section>

        <section class="desk-section">${monthsGrid()}</section>

        <section class="desk-section">
          <div class="chips">
            <span class="chips-label">Источник:</span>
            <button type="button" class="chip-btn ${sourceFilter === null ? 'active' : ''}" data-source="">Все</button>
            ${Object.keys(SOURCE_LABEL).map(k => `<button type="button" class="chip-btn ${sourceFilter === k ? 'active' : ''}" data-source="${k}">${esc(SOURCE_LABEL[k])}</button>`).join('')}
          </div>
          ${monthOpen()}
        </section>

        <section class="desk-section">
          <h3 class="block-h">Комиссионка</h3>
          <div class="shop-layout">
            ${shopList('sell')}
            ${shopSide('sell')}
            ${shopSide('buy')}
            ${shopList('buy')}
          </div>
        </section>

        <section class="desk-section">
          <div class="shop-side-head" style="margin-bottom:12px">
            <h3 class="block-h" style="margin:0">Долги${state.loans.length ? ` (${state.loans.length})` : ''}</h3>
            <span class="seg" data-debt-seg>
              ${[1, 2, 3].map(s => `<button type="button" data-debt="${s}" class="${debtStyle === s ? 'active' : ''}">Д${s}</button>`).join('')}
            </span>
          </div>
          <div class="stack">${debtsBlock()}</div>
        </section>`;

      document.querySelectorAll('[data-month]').forEach(b => b.addEventListener('click', () => {
        selected = b.dataset.month; render();
      }));
      document.querySelectorAll('[data-source]').forEach(b => b.addEventListener('click', () => {
        sourceFilter = b.dataset.source || null; render();
      }));
      document.querySelectorAll('[data-currency]').forEach(b => b.addEventListener('click', () => {
        currencyFilter = b.dataset.currency || null; render();
      }));
      document.querySelectorAll('[data-debt]').forEach(b => b.addEventListener('click', () => {
        debtStyle = Number(b.dataset.debt); render();
      }));
      document.querySelector('[data-clear-source]')?.addEventListener('click', () => { sourceFilter = null; render(); });
      document.querySelector('[data-clear-currency]')?.addEventListener('click', () => { currencyFilter = null; render(); });
      document.querySelector('[data-clear-query]')?.addEventListener('click', () => { query = ''; render(); });
      const qi = document.querySelector('[data-query]');
      qi?.addEventListener('input', () => { query = qi.value; render(); });
      if (searchFocused && qi) {
        qi.focus();
        const n = qi.value.length;
        try { qi.setSelectionRange(n, n); } catch { /* у type=search каретку не всегда ставят */ }
      }
      document.querySelector('[data-balance]')?.addEventListener('change', (e) => { showBalance = e.target.checked; render(); });
    };

    let balMap = {};
    render();
  </script>
</body>
</html>
