<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Слоты банка — проверка равенства</title>
<link rel="stylesheet" href="/css/core/variables.css" />
<link rel="stylesheet" href="/css/core/base.css" />
<link rel="stylesheet" href="/css/core/layout.css" />
<link rel="stylesheet" href="/css/core/components.css" />
<link rel="stylesheet" href="/css/modules/finance.css" />
<style>
  body { padding: 20px; }
  .probe { max-width: 640px; }
  .probe h3 { margin: 0 0 4px; font-size: 0.95rem; }
  .probe p { margin: 0 0 12px; font-size: 0.8rem; color: var(--text-dim); }
  /* Служебная линейка: видно, одинаковы ли плитки. В приложении её нет. */
  .probe .slots { position: relative; }
  .probe .slots::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    border: 1px dashed var(--danger);
  }
</style>
</head>
<body>
<div class="probe">
  <h3>Плитки: заполненные и пустые в одной сетке</h3>
  <p>Красная рамка — внешний размер сетки. Если какая-то плитка выше, она эту рамку порвёт.</p>
  <div class="slots">
    <div class="slot is-filled" style="--hue: 210"><span class="slot-name">Чешуя</span><span class="slot-qty">×12</span></div>
    <div class="slot is-filled" style="--hue: 280"><span class="slot-name">Ключ от Книги наставлений</span><span class="slot-qty">×1</span></div>
    <div class="slot is-filled" style="--hue: 30"><span class="slot-name">Знак доблести (25 штук)</span><span class="slot-qty">×3</span></div>
    <div class="slot is-filled" style="--hue: 140"><span class="slot-name">Камень</span><span class="slot-qty">×7</span></div>
    <div class="slot is-filled" style="--hue: 340"><span class="slot-name">Сундук средоточия</span><span class="slot-qty">×2</span></div>
    <div class="slot is-empty">+</div>
    <div class="slot is-empty">+</div>
    <div class="slot is-empty">+</div>
    <div class="slot is-empty">+</div>
    <div class="slot is-empty">+</div>
    <div class="slot is-filled" style="--hue: 200"><span class="slot-name">Знак единства (25 штук)</span><span class="slot-qty">×5</span></div>
    <div class="slot is-empty">+</div>
    <div class="slot is-empty">+</div>
    <div class="slot is-empty">+</div>
    <div class="slot is-filled" style="--hue: 90"><span class="slot-name">Чешуя дракона</span><span class="slot-qty">×128</span></div>
  </div>
</div>
</body>
</html>
