<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Твиноферма — управление пати</title>
    <style>
      :root {
        color-scheme: dark;
        font: 14px system-ui;
        color: #eef1ff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: transparent;
      }
      [hidden] {
        display: none !important;
      }
      input[type='range'] {
        width: 100%;
        margin-top: 10px;
      }
      main {
        height: 100vh;
        overflow: hidden;
        border: 0;
        border-radius: 10px;
      }
      #panel {
        background: rgba(16, 20, 30, var(--alpha, 0.9));
        height: calc(100vh - 52px);
        overflow: auto;
        padding: 14px;
      }
      body.folded #panel {
        display: none;
      }
      header span {
        flex: 1;
      }
      header {
        height: 52px;
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(16, 20, 30, calc(var(--alpha, 0.9) * 0.72));
        font-size: 15px;
        font-weight: 700;
        padding: 6px 10px;
        cursor: move;
        user-select: none;
      }
      button {
        padding: 8px;
        margin: 4px;
        border: 1px solid #637090;
        border-radius: 7px;
        background: #20283c;
        color: inherit;
        cursor: pointer;
      }
      li {
        margin: 8px 0;
      }
      kbd {
        float: right;
        color: #b7c2ff;
      }
      pre {
        white-space: pre-wrap;
        max-height: 260px;
        overflow: auto;
        font: 12px system-ui;
      }
      .muted {
        color: #aab1c6;
      }
    </style>
  </head>
  <body>
    <main>
      <header data-drag>
        <span>🎮 Управление пати</span
        ><button
          id="info-toggle"
          aria-controls="overlay-controls"
          aria-expanded="true"
          title="Скрыть или показать панель"
        >
          ⋯</button
        ><button data-action="stop" title="Остановить команду" aria-label="Остановить команду">■</button
        ><button
          id="fold"
          aria-controls="panel"
          aria-expanded="true"
          aria-label="Свернуть до верхней полосы"
          title="Свернуть до верхней полосы"
        >
          ▴</button
        ><button id="close" aria-label="Закрыть оверлей" title="Закрыть оверлей">×</button>
      </header>
      <section id="panel">
        <button id="back" hidden>← Назначенные клавиши</button>
        <section id="shortcuts-screen">
          <div id="overlay-controls">
            <p class="muted">Ваши сочетания команд. Ctrl+Alt+Pause — остановка при включённом управлении клавишами.</p>
            <p id="status">Ожидание главного окна…</p>
            <button data-view="appearance">Вид оверлея</button><button data-view="journal">Открыть журнал</button>
          </div>
          <h3>Назначенные клавиши</h3>
          <ul id="commands"></ul>
        </section>
        <section id="appearance-screen" hidden>
          <h3>Вид оверлея</h3>
          <label
            >Непрозрачность <output id="alpha-value">90%</output
            ><input id="opacity" type="range" min="30" max="100" value="90"
          /></label>
          <p>
            <label><input id="topmost" type="checkbox" checked /> Поверх других окон</label>
          </p>
          <p class="muted">
            Верхняя полоса прозрачнее основного фона. ▴ сворачивает окно; ⋯ скрывает служебную панель.
          </p>
          <button id="save-appearance">Сохранить</button>
          <p id="appearance-error" role="status"></p>
        </section>
        <section id="journal-screen" hidden>
          <h3>Журнал текущего сеанса</h3>
          <pre id="logs"></pre>
        </section>
      </section>
    </main>
    <script type="module" src="/js/modules/gameMacros/overlay.js"></script>
  </body>
</html>
