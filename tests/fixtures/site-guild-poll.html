<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Профиль клана — обезличенный пример</title></head>
<body>
  <!-- Вырезка из сохранённого профиля: структура опроса сайта сохранена;
       идентификатор, имена и ссылки заменены на вымышленные. Варианты подгружает API. -->
  <div class="user__events"></div>
  <div class="user__col"><div class="title">Пати в которых вы состоите</div></div>
  <div id="mainPoll" class="poll" data-poll-id="901">
    <h3 class="poll__title">
      <a href="https://example.com/players/101" class="poll-link" target="_blank">Персонаж А</a>
      /
      <a href="https://example.com/players/102" class="poll-link" target="_blank">Персонаж Б</a>
      /
      <a href="https://example.com/players/103" class="poll-link" target="_blank">Персонаж В</a>
    </h3>
    <form class="vote-form poll__form poll__form--no-results" data-poll-id="901">
      <div id="pollMessage" class="poll__message"></div>
      <div class="poll-options"></div>
      <button type="submit" class="poll__vote-btn">Проголосовать</button>
    </form>
  </div>
</body>
</html>
